<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F0E8">
  <meta name="description" content="日本職棒單場賽後分析的互動式網頁簡報索引。">
  <title>NPB Game Archive｜單場賽後分析</title>
  <link rel="stylesheet" href="css/site.css">
  <script src="js/home.js" defer></script>
</head>
<body class="home-page">
  <main class="home-shell">
    <header class="home-hero">
      <div class="eyebrow latin" lang="en">NPB / GAME ARCHIVE</div>
      <div class="hero-rule" aria-hidden="true"></div>
      <h1>每一場比賽，都值得再讀一次。</h1>
      <p class="hero-intro">從完整賽後分析出發，重新理解比分背後的攻防過程、球員表現與證據界線。</p>
      <div class="hero-meta" aria-label="網站內容類型">
        <span>單場賽事</span><span class="meta-dot" aria-hidden="true"></span><span>全員評級</span><span class="meta-dot" aria-hidden="true"></span><span>攻守脈絡</span>
      </div>
    </header>
    <section class="home-collection" aria-labelledby="archive-title">
      <div class="collection-head"><div><div class="eyebrow latin" lang="en">THE COLLECTION</div><h2 id="archive-title">賽事簡報</h2></div><p class="collection-count" id="count" aria-live="polite">資料載入中</p></div>
      <div class="game-grid" id="games"><p class="loading-message" role="status">正在載入賽事索引…</p></div>
    </section>
    <footer class="home-footer"><span>NPB 單場賽後分析 Wiki 轉互動簡報</span><span class="latin" lang="en">HTML · CSS · JavaScript</span></footer>
  </main>
</body>
</html>
